spring.application.name=users-accounts-service
server.port=${PORT:8081}
spring.datasource.url=${ACCOUNTS_DATABASE_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${ACCOUNTS_DATABASE_USERNAME:accounts}
spring.datasource.password=${ACCOUNTS_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=${DB_SCHEMA_INIT_MODE:never}
app.kafka.enabled=${APP_KAFKA_ENABLED:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
server.error.include-message=never
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
